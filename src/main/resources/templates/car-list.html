<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>二手車展示中心</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h1 class="mb-4">精選好車</h1>
    <div class="row">
        <div class="col-md-4 mb-4" th:each="car : ${cars}">
            <div class="card">
                <img th:src="${car.image}" class="card-img-top" alt="車輛圖片">
                <div class="card-body">
                    <h5 class="card-title" th:text="${car.name}">車名</h5>
                    <p class="card-text">
                        價格：<span th:text="${car.price}"></span><br>
                        里程：<span th:text="${car.mileage}"></span> km<br>
                        年份：<span th:text="${car.year}"></span>
                    </p>
                    <a href="#" class="btn btn-primary">立即預約試駕</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
